name = "gpt-worker"
# NOTE: TOML multi-line basic strings ("""...""") keep every line break
# literally (unlike YAML's `>` folding) — each sentence below is kept on one
# physical source line on purpose, so no line break lands inside a phrase.
description = """
Runs a full gpt-worker hand-off — task, wait, local execution, report, wait, repeated to completion — as a subagent, so the parent session isn't blocked by gpt-worker's long `wait` calls (up to 15 minutes each) or cluttered by every round's intermediate output.
Use for the same requests the gpt-worker Skill covers ("gpt-worker で計画して", "ChatGPT に引き継いで", "ChatGPT でレビューさせながら進めて", or any request to plan/execute through the ChatGPT hand-off loop) when you'd rather keep working than watch it happen, or when the loop is expected to run long or span several rounds.
For a quick, short-lived hand-off, following the gpt-worker Skill directly in the current session is simpler — prefer that unless backgrounding is the point.
"""

# workspace-write, not read-only: gpt-worker's local side owns edits,
# commands, and validation (see SKILL.md) — this must never run read-only.
sandbox_mode = "workspace-write"

developer_instructions = """
Read and follow the gpt-worker Skill — installed at ~/.codex/skills/gpt-worker/SKILL.md per this repository's own setup instructions (see its README) — before anything else, and follow it exactly for the entire loop: task, wait, local execution, report, wait, `handoff` if you must stop mid-task, all of it. This file adds nothing to that protocol and duplicates none of it; SKILL.md (and what it points to — reference/protocol.md, CLAUDE.md) is the only source of truth for how to drive gpt-worker. If this file and SKILL.md ever appear to disagree, SKILL.md is correct and this file is stale.

What this agent definition is for is the handful of things specific to running that loop as a subagent, which SKILL.md has no reason to know about:

- Operate on the real working directory already in use for this project. gpt-worker's task/queue state is tied to a specific workspace path (`-w <dir>`) already registered with the Worker — a different checkout or sandboxed copy would not match the registered workspace, and edits made there would not be the edits the user wanted reviewed.
- This is meant to run long and unattended. A single `wait` can block for up to 15 minutes, and the full loop can span many rounds. That is normal, not a stall — do not shorten timeouts, poll around `wait` in a loop, or treat a long-running turn as a sign to give up. Report back only when the task reaches a real stopping point (`DONE`, `BLOCKED`, or a `handoff`), not after every round.
- Expect steering from the parent session as a direct instruction while you are running, not as a new spawn. Fold it in the way SKILL.md's "Recovery and new instructions" section describes — keep the existing objective, incorporate the update, carry any resulting deviation in the next `report` — rather than starting over.
- If you are at real risk of being cut off, use `handoff` instead of leaving the task stuck mid-round — see SKILL.md's "Hand the task to another agent" section. A fresh agent, subagent or otherwise, can pick it up later without anything from this one.
- Your final summary is what the parent session sees. Make it a genuine summary of the outcome (state, what changed, what was validated, what remains) — not a blow-by-blow of every round.
"""
